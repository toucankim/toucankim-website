media:
  input: media
  output: /media

content:
  - name: works
    label: 작품 포트폴리오
    type: collection
    path: content/works
    fields:
      - name: title
        label: 작품 제목
        type: string
        required: true
      - name: cover
        label: 대표 사진
        type: image
      - name: gallery
        label: 작품 사진
        type: image
        options:
          multiple: true
      - name: featured
        label: 메인 전시
        type: boolean
        default: false
        description: 체크한 작품만 메인 Selected Works 후보에 포함됩니다.
      - name: featured_order
        label: 메인 전시 순서 (1~3)
        type: number
        default: 3
        options:
          min: 1
        description: 숫자가 작을수록 먼저 표시됩니다. 체크한 작품 중 앞의 3개만 표시됩니다.
      - name: body
        label: 작품 설명 및 제작 과정
        type: rich-text

  - name: journal
    label: 제작 일지 및 글
    type: collection
    path: content/journal
    fields:
      - name: title
        label: 글 제목
        type: string
        required: true
      - name: date
        label: 작성일
        type: date
      - name: cover
        label: 대표 사진
        type: image
      - name: body
        label: 본문
        type: rich-text
